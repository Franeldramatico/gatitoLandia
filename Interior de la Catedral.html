<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interior de la Catedral (2D)</title>
<style>
:root{--bg:#0c0805}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
svg{display:block;width:100%;height:100%}
.fl{animation:fl 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{opacity:.7;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
</style></head><body>
<svg id="s" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const AP=(hw,r,N=18)=>{const a=(r*r-hw*hw)/(2*hw),R=hw+a,p1=Math.acos(-a/R),L=[];for(let i=0;i<=N;i++){const h=Math.PI+(p1-Math.PI)*i/N;L.push([a+R*Math.cos(h),R*Math.sin(h)])}return L.concat(L.slice(0,-1).reverse().map(([u,v])=>[-u,v]))};
const line=(cx,sy,hw,r)=>AP(hw,r).map(([u,v],i)=>(i?'L':'M')+(cx+u).toFixed(1)+' '+(sy-v).toFixed(1)).join('');
const shape=(cx,sy,hw,r,base)=>`M${cx-hw} ${base}L${line(cx,sy,hw,r).slice(1)}L${cx+hw} ${base}Z`;
const S='#2a2016',STN='#b9a98e';
const defs=`<defs>
<pattern id="blk" width="96" height="64" patternUnits="userSpaceOnUse"><rect width="96" height="64" fill="#a39279"/><rect width="48" height="32" fill="#ab9b82"/><rect x="48" y="32" width="48" height="32" fill="#9b8a71"/><path d="M0 0H96M0 32H96M0 0V32M48 0V32M24 32V64M72 32V64" stroke="#4a3b2a" stroke-opacity=".35" stroke-width="1.5" fill="none"/></pattern>
<pattern id="tile" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="#76634d"/><path d="M40 0L80 20L40 40L0 20Z" fill="#54443a" stroke="#2c2118" stroke-width="1.5"/></pattern>
<pattern id="ld" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 12L12 0L24 12L12 24Z" fill="none" stroke="#120a05" stroke-width="1.6" opacity=".8"/></pattern>
<linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".45" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="flr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c982"/><stop offset="1" stop-color="#9a752f"/></linearGradient>
<linearGradient id="vel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a171f"/><stop offset="1" stop-color="#3a0a0f"/></linearGradient>
<radialGradient id="gw"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
</defs>`;
const C={b:'#1f4a96',r:'#a3202e',g:'#d6a529',e:'#1f7a4d',v:'#5a2c8a'};
let n=0;
const glass=(d,x,y0,y1,w,cols)=>{const id='cg'+n++;let s=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">`,i=0;
for(let y=y0;y<y1;y+=40,i++)s+=`<rect x="${x-w}" y="${y}" width="${2*w}" height="40" fill="${cols[i%cols.length]}"/>`;
for(let y=y0+30,k=0;y<y1;y+=80,k++)s+=`<circle cx="${x}" cy="${y}" r="${w*.52}" fill="${cols[(k+2)%cols.length]}" stroke="#120a05" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="${w*.2}" fill="#e3c06a" opacity=".85"/>`;
const R=`x="${x-w}" y="${y0}" width="${2*w}" height="${y1-y0}"`;
s+=`<rect ${R} fill="url(#ld)"/><rect ${R} fill="url(#gs)"/><line x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" stroke="#120a05" stroke-width="3"/></g>`;
return s+`<path d="${d}" fill="none" stroke="${STN}" stroke-width="10"/><path d="${d}" fill="none" stroke="${S}" stroke-width="2"/>`};
const flame=(x,y,r=1)=>`<circle cx="${x}" cy="${y}" r="${16*r}" fill="url(#gw)" opacity=".22"/><ellipse class="fl" cx="${x}" cy="${y}" rx="${3.2*r}" ry="${7*r}" fill="#ffd98a"/>`;
let o=[defs];
// muro de sillería y suelo
o.push('<rect width="1200" height="800" fill="url(#blk)"/>','<rect y="650" width="1200" height="150" fill="url(#tile)"/><rect y="650" width="1200" height="150" fill="url(#flr)"/>');
// friso de arcos ciegos
o.push('<rect y="560" width="1200" height="90" fill="#85765f"/><rect y="560" width="1200" height="9" fill="#b5a589"/><rect y="568" width="1200" height="3" fill="#3a2e22"/>');
for(let x=0;x<1200;x+=60)o.push(`<path d="${shape(x+30,615,20,30,650)}" fill="#5e5040" stroke="#3a2e22" stroke-width="2"/>`);
// ventanales laterales, rosetones y estandartes
for(const cx of[216,984]){
 o.push(glass(shape(cx,250,52,100,480),cx,150,480,52,[C.b,C.r,C.g,C.e]));
 o.push(`<rect x="${cx-72}" y="480" width="144" height="16" fill="${STN}" stroke="${S}" stroke-width="2"/>`);
 o.push(`<circle cx="${cx}" cy="78" r="40" fill="${STN}" stroke="${S}" stroke-width="3"/>`);
 let q='';[[0,-17],[0,17],[-17,0],[17,0]].forEach(([dx,dy],i)=>q+=`<circle cx="${cx+dx}" cy="${78+dy}" r="17" fill="${[C.r,C.b,C.g,C.e][i]}" stroke="#120a05" stroke-width="2.5"/>`);
 o.push(q+`<circle cx="${cx}" cy="78" r="7" fill="#e3c06a"/>`);
 o.push(`<path d="M${cx-24} 510H${cx+24}V562L${cx} 548L${cx-24} 562Z" fill="#8d1a24" stroke="#c2a35c" stroke-width="2.5"/><rect x="${cx-3}" y="518" width="6" height="26" fill="url(#gd)"/><rect x="${cx-11}" y="526" width="22" height="6" fill="url(#gd)"/>`)}
// ábside dentro del arco presbiteral
const AX=600,SY=320,HW=230,RS=270;
o.push(`<clipPath id="ap"><path d="${shape(AX,SY,HW,RS,650)}"/></clipPath><g clip-path="url(#ap)"><rect x="300" y="0" width="600" height="650" fill="url(#blk)"/><rect x="300" y="0" width="600" height="650" fill="#1a0f08" opacity=".55"/><rect x="300" y="0" width="600" height="650" fill="url(#top)"/>`);
{let s=`<circle cx="600" cy="172" r="68" fill="${STN}" stroke="${S}" stroke-width="3"/><circle cx="600" cy="172" r="58" fill="#1b1228"/>`;
 for(let k=0;k<12;k++){const a=k*Math.PI/6;s+=`<circle cx="${(600+Math.cos(a)*38).toFixed(1)}" cy="${(172+Math.sin(a)*38).toFixed(1)}" r="15" fill="${Object.values(C)[k%5]}" stroke="#120a05" stroke-width="2.5"/>`;s+=`<line x1="600" y1="172" x2="${(600+Math.cos(a)*58).toFixed(1)}" y2="${(172+Math.sin(a)*58).toFixed(1)}" stroke="#120a05" stroke-width="2"/>`}
 s+=`<circle cx="600" cy="172" r="15" fill="#e3c06a" stroke="#120a05" stroke-width="2.5"/>`;
 s+=glass(shape(600,330,38,78,455),600,252,455,38,[C.b,C.r,C.g,C.b])+glass(shape(525,350,28,58,455),525,292,455,28,[C.r,C.b,C.g,C.e])+glass(shape(675,350,28,58,455),675,292,455,28,[C.e,C.g,C.b,C.r]);
 s+=`<rect x="490" y="455" width="220" height="196" fill="url(#vel)" stroke="#b08d4a" stroke-width="4"/>`;
 for(let x=510;x<700;x+=20)s+=`<line x1="${x}" y1="458" x2="${x}" y2="648" stroke="#000" stroke-opacity=".28" stroke-width="3"/>`;
 s+=`<rect x="490" y="455" width="220" height="10" fill="url(#gd)"/>`;
 // gradas y alfombra
 s+=`<rect x="380" y="636" width="440" height="16" fill="#8a7a63"/><rect x="420" y="622" width="360" height="15" fill="#978769"/><rect x="460" y="608" width="280" height="15" fill="#a39373"/><path d="M380 636H820M420 622H780M460 608H740" stroke="#3a2e22" stroke-width="2"/>`;
 s+=`<rect x="548" y="608" width="104" height="44" fill="#74121b"/>`;
 // altar
 s+=`<rect x="505" y="546" width="190" height="14" fill="#ece2cb" stroke="#8e7f65" stroke-width="2"/><rect x="515" y="560" width="170" height="48" fill="#cdbd9f" stroke="#8e7f65" stroke-width="2"/><rect x="530" y="566" width="140" height="38" fill="#7a1019" stroke="#c2a15a" stroke-width="3"/><rect x="596" y="572" width="8" height="26" fill="url(#gd)"/><rect x="588" y="580" width="24" height="7" fill="url(#gd)"/>`;
 s+=`<rect x="594" y="468" width="12" height="78" fill="url(#gd)"/><rect x="570" y="490" width="60" height="12" fill="url(#gd)"/><circle cx="600" cy="468" r="7" fill="url(#gd)"/>`;
 for(const x of[535,565,635,665]){const h=x%100<60?42:30;s+=`<rect x="${x-3}" y="${546-h}" width="6" height="${h}" fill="#efe6cf"/>`+flame(x,546-h-8)}
 // candelabros
 for(const x of[408,792]){s+=`<rect x="${x-3}" y="520" width="6" height="116" fill="url(#gd)"/><rect x="${x-14}" y="626" width="28" height="10" fill="url(#gd)"/><path d="M${x-26} 508Q${x} 530 ${x+26} 508" stroke="#8f6a2a" stroke-width="4" fill="none"/>`;for(const d of[-26,0,26])s+=`<rect x="${x+d-3}" y="${d?492:504}" width="6" height="${d?16:12}" fill="#efe6cf"/>`+flame(x+d,d?484:496,.8)}
 o.push(s+'</g>')}
// arco presbiteral: molduras
for(const[hw,r,w,c]of[[262,300,14,'#8f806a'],[246,285,22,STN]])o.push(`<path d="${line(AX,SY,hw,r)}" fill="none" stroke="${c}" stroke-width="${w}"/>`);
o.push(`<path d="${line(AX,SY,230,270)}" fill="none" stroke="${S}" stroke-width="3"/><path d="${line(AX,SY,254,293)}" fill="none" stroke="#c2a35c" stroke-width="2.5"/>`);
for(let i=0;i<=14;i++){const[u,v]=AP(246,285,14)[i];o.push(`<circle cx="${(AX+u).toFixed(1)}" cy="${(SY-v).toFixed(1)}" r="3.5" fill="#6e5f4a"/>`)}
// pilares (tonos planos, sin brillos metálicos)
const pier=(cx,w,top)=>{const x=cx-w/2;return `<rect x="${x}" y="${top}" width="${w}" height="${650-top}" fill="#9b8b73"/><rect x="${x}" y="${top}" width="${w*.28}" height="${650-top}" fill="#7d6f5a"/><rect x="${x+w*.28}" y="${top}" width="${w*.42}" height="${650-top}" fill="#b4a489"/><rect x="${x+w*.88}" y="${top}" width="${w*.12}" height="${650-top}" fill="#6f624e"/><path d="M${x+w*.28} ${top}V650M${x+w*.7} ${top}V650" stroke="#3a2e22" stroke-opacity=".5" stroke-width="2"/>`+`<rect x="${x-10}" y="626" width="${w+20}" height="24" fill="#a69677" stroke="${S}" stroke-width="2"/><rect x="${x-6}" y="618" width="${w+12}" height="10" fill="#8d7e63" stroke="${S}" stroke-width="2"/>`};
const cap=(cx,w,y)=>{let s=`<rect x="${cx-w/2-14}" y="${y}" width="${w+28}" height="28" fill="#a69677" stroke="${S}" stroke-width="2"/><rect x="${cx-w/2-20}" y="${y-10}" width="${w+40}" height="12" fill="#bdae92" stroke="${S}" stroke-width="2"/>`;for(let k=0;k<5;k++)s+=`<circle cx="${cx-w/2-4+k*(w+8)/4}" cy="${y+14}" r="4" fill="#6e5f4a"/>`;return s};
for(const cx of[342,858])o.push(pier(cx,56,322)+cap(cx,56,296));
for(const cx of[80,1120])o.push(pier(cx,76,0)+cap(cx,76,296)+`<rect x="${cx-48}" y="556" width="96" height="14" fill="#b5a589" stroke="${S}" stroke-width="2"/>`);
// alfombra y bancos
o.push('<rect x="520" y="650" width="160" height="150" fill="#74121b"/><path d="M520 650V800M680 650V800" stroke="#b08d4a" stroke-width="5"/><path d="M532 650V800M668 650V800" stroke="#b08d4a" stroke-width="2"/>');
for(const[y,h,x0]of[[676,30,170],[708,40,120],[748,54,60]])for(const m of[0,1]){const x=m?1200-492:x0,w=492-x0;
 o.push(`<g ${m?'':''}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#4b2f1b" stroke="#2a180b" stroke-width="2"/><rect x="${x}" y="${y}" width="${w}" height="6" rx="3" fill="#8a5c34"/><rect x="${m?x+w-14:x}" y="${y-14}" width="14" height="${h+14}" rx="3" fill="#5d3a21" stroke="#2a180b" stroke-width="2"/>`+`<path d="${Array.from({length:Math.floor(w/80)},(_,i)=>`M${x+40+i*80} ${y+10}v${h-14}`).join('')}" stroke="#2a180b" stroke-opacity=".5" stroke-width="2"/></g>`)}
// lámparas de hierro
for(const cx of[470,730]){let s=`<path d="M${cx} 0V205M${cx} 205L${cx-70} 232M${cx} 205L${cx+70} 232" stroke="#241a12" stroke-width="3" fill="none"/><path d="M${cx-70} 232Q${cx} 262 ${cx+70} 232" stroke="#241a12" stroke-width="6" fill="none"/><circle cx="${cx}" cy="266" r="6" fill="#241a12"/>`;
 for(const u of[-.9,-.45,0,.45,.9]){const x=cx+70*u,y=232+15*(1-u*u);s+=`<rect x="${x-2.5}" y="${y-18}" width="5" height="18" fill="#efe6cf"/>`+flame(x,y-25,.8)}
 o.push(s)}
o.push('<rect width="1200" height="800" fill="url(#top)"/><rect width="1200" height="800" fill="url(#vg)"/>');
document.getElementById('s').innerHTML=o.join('');
</script></body></html>
